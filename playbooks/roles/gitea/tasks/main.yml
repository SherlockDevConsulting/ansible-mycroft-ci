- name: Create Gitea directories
  file:
    path: "/opt/gitea"
    state: directory
    mode: '0755'

- name: Deploy Gitea Docker Compose file
  template:
    src: docker-compose.yml.j2
    dest: /opt/gitea/docker-compose.yml

- name: Start Gitea service
  command: docker compose -f /opt/gitea/docker-compose.yml up -d
