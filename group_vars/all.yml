# General variables
ansible_python_interpreter: /usr/bin/python3

# Config network
network_static_ip: "192.168.1.100"
network_gateway: "192.168.1.1"
network_nameservers:
  - "8.8.8.8"
  - "1.1.1.1"

# List of packages to install
default_packages:
  - git
  - curl
  - vim
  - unzip
  - python3-pip
  - net-tools
